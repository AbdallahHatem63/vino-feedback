<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self' https://formsubmit.co; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>فينو | شكاوى واقتراحات</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow-x:hidden;font-family:Tahoma,"Segoe UI",Arial,sans-serif;background:#0f172a;color:#e5e7eb;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:16px}
.card{width:100%;max-width:520px;background:#1e293b;border-radius:18px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
h1{margin:0 0 6px;font-size:22px}
p.sub{margin:0 0 18px;color:#94a3b8;font-size:14px}
label{display:block;margin:12px 0 6px;font-size:14px;color:#cbd5e1}
select,input,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#e5e7eb;font:inherit}
textarea{min-height:140px;resize:vertical}
button{margin-top:18px;width:100%;padding:13px;border:0;border-radius:10px;background:#22c55e;color:#06260f;font:inherit;font-weight:bold;font-size:16px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.hp{position:absolute;width:1px;height:1px;padding:0;border:0;overflow:hidden;clip:rect(0,0,0,0);opacity:0;pointer-events:none}
.ok{text-align:center;padding:20px 0}
.check{width:84px;height:84px;border-radius:50%;background:#22c55e;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;animation:pop .35s ease}
.check svg{width:46px;height:46px}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.err{background:#7f1d1d;color:#fecaca;padding:10px 12px;border-radius:10px;margin-top:14px;font-size:14px;display:none}
a.again{display:inline-block;margin-top:14px;color:#93c5fd;cursor:pointer;font-size:14px}
</style>
</head>
<body>
<div class="card">
  <div id="formBox">
    <h1>🎓 فينو</h1>
    <p class="sub">اكتب لنا شكوى أو سؤال أو مشكلة أو اقتراح، ورأيك بيوصلنا مباشرة</p>
    <form id="f" autocomplete="off">
      <label for="kind">نوع الرسالة</label>
      <select id="kind">
        <option value="suggestion">اقتراح</option>
        <option value="complaint">شكوى</option>
        <option value="problem">مشكلة</option>
        <option value="question">سؤال</option>
      </select>
      <label for="msg">اكتب رسالتك</label>
      <textarea id="msg" maxlength="2000" required placeholder="اكتب هنا..."></textarea>
      <label for="name">اسمك (اختياري)</label>
      <input id="name" maxlength="60">
      <label for="contact">تليجرام أو إيميل للتواصل (اختياري)</label>
      <input id="contact" maxlength="80">
      <input class="hp" id="hp" tabindex="-1" aria-hidden="true">
      <button id="btn" type="submit">إرسال</button>
      <div class="err" id="err"></div>
    </form>
  </div>
  <div id="okBox" class="ok" style="display:none">
    <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="#06260f" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h2 id="okMsg" style="margin:0 0 6px"></h2>
    <p class="sub" style="margin:0">شكرا لوقتك</p>
    <a class="again" id="again">إرسال رسالة تانية</a>
  </div>
</div>
<script>
// عنوان الإيميل اللي بتوصله الرسايل (FormSubmit.co مجاني من غير كارت، ولازم تأكيد مرة واحدة من الإيميل)
var TO_EMAIL = "ubdallahhutem@gmail.com";
var KINDS = {
  suggestion: ["اقتراح", "تم بنجاح إضافة اقتراحك وسينفذ قريبا"],
  complaint:  ["شكوى", "تم بنجاح استلام شكواك وسيتم النظر فيها قريبا"],
  problem:    ["مشكلة", "تم بنجاح استلام مشكلتك وسيتم حلها قريبا"],
  question:   ["سؤال", "تم بنجاح استلام سؤالك وسيتم الرد عليه قريبا"]
};
function san(v, n) { return String(v || "").replace(/[\u0000-\u0008\u000b-\u001f<>]/g, "").trim().slice(0, n); }
var $ = function (id) { return document.getElementById(id); };
$("f").addEventListener("submit", function (e) {
  e.preventDefault();
  var err = $("err"); err.style.display = "none";
  if ($("hp").value) { return; }                       // فخ للبوتات
  var msg = san($("msg").value, 2000);
  if (msg.length < 3) { err.textContent = "اكتب رسالتك الأول"; err.style.display = "block"; return; }
  var last = +localStorage.getItem("vino_fb_last") || 0;
  if (Date.now() - last < 20000) { err.textContent = "استنى شوية قبل ما تبعت رسالة تانية"; err.style.display = "block"; return; }
  var k = $("kind").value, btn = $("btn");
  btn.disabled = true; btn.textContent = "بيتبعت...";
  var payload = {
    _subject: "فينو | " + KINDS[k][0] + " جديدة",
    _template: "table",
    _captcha: "false",
    "النوع": KINDS[k][0],
    "الرسالة": msg,
    "الاسم": san($("name").value, 60) || "-",
    "للتواصل": san($("contact").value, 80) || "-"
  };
  fetch("https://formsubmit.co/ajax/" + encodeURIComponent(TO_EMAIL), {
    method: "POST",
    headers: {"Content-Type": "application/json", "Accept": "application/json"},
    body: JSON.stringify(payload)
  }).then(function (r) { return r.json().catch(function () { return {}; }); })
    .then(function (d) {
      if (d && (d.success === "true" || d.success === true)) {
        localStorage.setItem("vino_fb_last", String(Date.now()));
        $("okMsg").textContent = KINDS[k][1];
        $("formBox").style.display = "none"; $("okBox").style.display = "block";
      } else { throw new Error((d && d.message) || "failed"); }
    })
    .catch(function () {
      err.textContent = "ماقدرناش نبعت رسالتك دلوقتي، جرب تاني بعد شوية";
      err.style.display = "block";
    })
    .then(function () { btn.disabled = false; btn.textContent = "إرسال"; });
});
$("again").onclick = function () { $("msg").value = ""; $("okBox").style.display = "none"; $("formBox").style.display = "block"; };
</script>
</body>
</html>
